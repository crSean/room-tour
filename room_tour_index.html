<head>

  <title>Room Tour 360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #panorama { width: 100vw; height: 100vh; background: #111; }
    .overlay { position: fixed; z-index: 10; left: 16px; right: 16px; top: max(16px, env(safe-area-inset-top)); display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
    .pill, .buttons button { pointer-events: auto; border: 1px solid rgba(255,255,255,0.25); background: rgba(20,20,20,0.62); color: #fff; border-radius: 999px; padding: 10px 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 18px rgba(0,0,0,0.22); font-size: 14px; }
    .buttons { display: flex; gap: 8px; }
    .bottom { position: fixed; z-index: 10; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: min(92vw, 760px); background: rgba(20,20,20,0.58); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 10px 14px; text-align: center; font-size: 13px; line-height: 1.35; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    a.help { color: #cfe3ff; }
  </style>
</head>

    const viewer = pannellum.viewer('panorama', {
      type: 'equirectangular',
      panorama: panoramaData,
      autoLoad: true,
      showControls: true,
      draggable: true,
      mouseZoom: true,
      doubleClickZoom: true,
      compass: false,
      hfov: 100,
      pitch: 0,
      yaw: 0,
      backgroundColor: '#111'
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      viewer.setPitch(0, 600);
      viewer.setYaw(0, 600);
      viewer.setHfov(100, 600);
    });

    document.getElementById('fsBtn').addEventListener('click', () => {
      if (viewer.toggleFullscreen) viewer.toggleFullscreen();
      else if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    });

    let motionOn = false;
    async function enableMotion() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response !== 'granted') return;
        }
        if (typeof viewer.startOrientation === 'function') {
          viewer.startOrientation();
          motionOn = true;
          document.getElementById('gyroBtn').textContent = 'Motion on';
        } else {
          alert('Motion control is not available in this browser, but touch dragging should still work.');
        }
      } catch (e) {
        console.error(e);
        alert('Unable to enable motion controls on this device.');
      }
    }
    document.getElementById('gyroBtn').addEventListener('click', enableMotion);
  </script>
