<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Room Tour 360</title>
  <style>
    html,body{height:100%;margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #status{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  </style>
</head>
<body>
  <div id="status">Loading 360° room tour…</div>
  <script>
    (async () => {
      try {
        const response = await fetch('./room_tour_index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let html = await response.text();

        // Pannellum expects backgroundColor as an RGB numeric array, not a CSS string.
        html = html.replaceAll('pannellum@2.5.6', 'pannellum@2.5.7');
        html = html.replace("backgroundColor: '#111'", "backgroundColor: [0.067, 0.067, 0.067],\n      ignoreGPanoXMP: true");

        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        document.getElementById('status').textContent = 'Unable to load the room tour: ' + err.message;
        console.error(err);
      }
    })();
  </script>
</body>
</html>
